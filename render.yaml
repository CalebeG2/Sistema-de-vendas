services:
  - type: web
    name: lamb-store-backend
    runtime: node
    rootDir: Lamb Store System Design (1)/back
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
